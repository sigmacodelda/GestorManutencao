<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gestor de Manutenção</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/GestorManutencao.UI/app.css" />
    <link rel="icon" href="data:,">
    <script>
        // Modo claro por defeito; o escuro só se o utilizador o escolheu (guardado neste dispositivo), nunca pelo sistema.
        window.gmModo = {
            obter: function () { try { return localStorage.getItem("modo") === "escuro" ? "escuro" : "claro"; } catch (e) { return "claro"; } },
            definir: function (m) {
                m = m === "escuro" ? "escuro" : "claro";
                document.documentElement.setAttribute("data-modo", m);
                try { localStorage.setItem("modo", m); } catch (e) { /* sem armazenamento: vale só nesta sessão */ }
                return m;
            }
        };
        document.documentElement.setAttribute("data-modo", window.gmModo.obter());

        // Páginas Razor: levar o ecrã a um elemento (e, com foco=true, dar-lhe o foco). Sem o elemento não faz nada.
        window.gmIr = function (id, foco) {
            var el = document.getElementById(id); if (!el) return;
            var reduzir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (foco) { try { el.focus({ preventScroll: true }); } catch (e) { } }
            el.scrollIntoView({ behavior: reduzir ? "auto" : "smooth", block: "center" });
        };

        // Erros e avisos de texto simples flutuam no topo (o original fica escondido por CSS): o ecrã não mexe.
        // Confirmações com botões (.alerta-pin, .alerta-devolvida, .alerta-confirma) ficam no sítio.
        (function () {
            var SEL = '.campo-erro[role="alert"], .alerta[role="alert"]:not(.alerta-pin):not(.alerta-devolvida):not(.alerta-confirma), .campo-aviso[role="alert"], .campo-aviso[role="status"]';
            var vistos = new WeakMap(), agendado = false, zona = null;
            function obterZona() {
                if (zona && zona.isConnected) return zona;
                zona = document.createElement("div");
                zona.className = "gm-avisos"; zona.setAttribute("role", "status"); zona.setAttribute("aria-live", "assertive"); zona.setAttribute("aria-atomic", "false");
                document.body.appendChild(zona);
                return zona;
            }
            function mostrar(texto, erro) {
                var z = obterZona(), el = null;
                for (var i = 0; i < z.children.length; i++) if (z.children[i].textContent === texto) el = z.children[i];
                if (!el) {
                    el = document.createElement("p");
                    el.className = "gm-aviso " + (erro ? "gm-aviso-erro" : "gm-aviso-info");
                    el.textContent = texto;
                    el.onclick = function () { el.remove(); };
                    z.appendChild(el);
                    while (z.children.length > 3) z.removeChild(z.firstChild);
                }
                clearTimeout(el._t);
                el._t = setTimeout(function () { el.remove(); }, erro ? 8000 : 6000);
            }
            function verificar() {
                agendado = false;
                document.querySelectorAll(SEL).forEach(function (el) {
                    var t = (el.textContent || "").trim();
                    if (!t) { vistos.delete(el); return; }
                    if (vistos.get(el) === t) return;
                    vistos.set(el, t);
                    mostrar(t, !el.classList.contains("campo-aviso"));
                });
            }
            document.addEventListener("DOMContentLoaded", obterZona);
            new MutationObserver(function () { if (!agendado) { agendado = true; requestAnimationFrame(verificar); } })
                .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        })();

        // Um aviso de erro (role="alert") que aparece ou muda de texto fora do ecrã sobe até se ver, sem mexer se já está visível.
        (function () {
            var vistos = new WeakMap(), agendado = false;
            function verificar() {
                agendado = false;
                document.querySelectorAll('[role="alert"]').forEach(function (el) {
                    var t = (el.textContent || "").trim();
                    if (!t || vistos.get(el) === t) return;
                    vistos.set(el, t);
                    var r = el.getBoundingClientRect();
                    if (r.top >= 0 && r.bottom <= window.innerHeight) return;
                    var reduzir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
                    el.scrollIntoView({ behavior: reduzir ? "auto" : "smooth", block: "nearest" });
                });
            }
            new MutationObserver(function () { if (!agendado) { agendado = true; requestAnimationFrame(verificar); } })
                .observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        })();

        // Área de desenho da assinatura: traço a azul-escuro sobre fundo branco, exportado em PNG (data URL).
        window.gmAssinatura = (function () {
            var estados = {};
            function pos(c, e) { var r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * c.width / r.width, y: (e.clientY - r.top) * c.height / r.height }; }
            function fundo(c) { var g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height); /* PNG com fundo transparente; o fundo branco é só do CSS */ g.strokeStyle = "#1A1731"; g.lineWidth = 3; g.lineCap = "round"; g.lineJoin = "round"; }
            return {
                iniciar: function (id, ref) {
                    var c = document.getElementById(id); if (!c) return;
                    var est = estados[id] = { ref: ref, desenha: false, traco: false, ultimo: null };
                    fundo(c);
                    c.style.touchAction = "none";
                    function avisar() { try { est.ref.invokeMethodAsync("AoMudar", est.traco); } catch (e) { } }
                    c.onpointerdown = function (e) { c.setPointerCapture(e.pointerId); est.desenha = true; est.ultimo = pos(c, e); var g = c.getContext("2d"); g.beginPath(); g.moveTo(est.ultimo.x, est.ultimo.y); g.lineTo(est.ultimo.x + 0.01, est.ultimo.y); g.stroke(); if (!est.traco) { est.traco = true; avisar(); } e.preventDefault(); };
                    c.onpointermove = function (e) { if (!est.desenha) return; var p = pos(c, e), g = c.getContext("2d"); g.beginPath(); g.moveTo(est.ultimo.x, est.ultimo.y); g.lineTo(p.x, p.y); g.stroke(); est.ultimo = p; e.preventDefault(); };
                    c.onpointerup = c.onpointercancel = function () { est.desenha = false; };
                },
                carregar: function (id, url) {
                    var c = document.getElementById(id), est = estados[id]; if (!c || !est) return;
                    var img = new Image();
                    img.onload = function () { c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); est.traco = true; try { est.ref.invokeMethodAsync("AoMudar", true); } catch (e) { } };
                    img.src = url;
                },
                limpar: function (id) { var c = document.getElementById(id), est = estados[id]; if (!c || !est) return; fundo(c); est.traco = false; try { est.ref.invokeMethodAsync("AoMudar", false); } catch (e) { } },
                exportar: function (id) { var c = document.getElementById(id); return c ? c.toDataURL("image/png") : ""; },
                parar: function (id) { delete estados[id]; }
            };
        })();
    </script>
</head>

<body>
    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
